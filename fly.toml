# Fly.io config for the AI-SRE app (API + worker in one app, two process
# groups → one machine each). Postgres runs as a separate Fly app — see
# ops/fly/db/fly.toml and docs/deploy.md.

app = "nightswatch"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[deploy]
  # Runs on a throwaway machine before the deploy is promoted:
  # alembic + procrastinate schemas (two owners, two steps).
  release_command = "sh ops/fly/release.sh"

[processes]
  api = "uvicorn ai_sre.main:app --host 0.0.0.0 --port 8000"
  worker = "python -m ai_sre.workers.investigation_worker"

[env]
  AI_SRE_ENV = "prod"

[http_service]
  internal_port = 8000
  processes = ["api"]
  force_https = true
  # NEVER let Fly idle the API out: customer Alertmanagers push webhooks to
  # us and a stopped machine drops alerts (NFR-3.1).
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/readyz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  processes = ["api", "worker"]
